name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  planning-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python test_planning.py
      - run: python solve_pddl.py
      - run: python demo.py
